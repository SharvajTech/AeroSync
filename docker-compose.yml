services:

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${DB_NAME:-aerosync}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aerosync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: aerosync-ml/Dockerfile
    environment:
      PORT: 8000
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

  backend:
    restart: unless-stopped
    build:
      context: ./aerosync-backend
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aerosync}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ML_SERVICE_URL: http://ml-service:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      JWT_SECRET: ${JWT_SECRET:-THIS_IS_ONLY_FOR_LOCAL_DEVELOPMENT_123456789}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    restart: unless-stopped
    build:
      context: ./aerosync-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      BACKEND_UPSTREAM: http://backend:8080
    depends_on:
      backend:
        condition: service_started

  dashboard:
    restart: unless-stopped
    build:
      context: .
      dockerfile: aerosync-dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8080
      ML_URL: http://ml-service:8000
    volumes:
      - ./aerosync-ml/data:/app/aerosync-ml/data:ro
      - ./aerosync-ml/gnn:/app/aerosync-ml/gnn:ro
    depends_on:
      backend:
        condition: service_started
      ml-service:
        condition: service_healthy

volumes:
  postgres_data: