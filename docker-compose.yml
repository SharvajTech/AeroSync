services:

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${DB_NAME:-aerosync}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aerosync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: aerosync-ml/Dockerfile
    environment:
      PORT: 8000
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6

  backend:
    restart: unless-stopped
    build:
      context: ./aerosync-backend
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aerosync}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ML_SERVICE_URL: http://ml-service:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Set JWT_SECRET (32+ characters) in .env; when empty the backend uses a
      # random per-start key, so sessions end on every restart.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-28800000}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      # Stage 4: SYNTHETIC (default, no external flight data), LIVE or HYBRID.
      AEROSYNC_DATA_MODE: ${AEROSYNC_DATA_MODE:-SYNTHETIC}
      # OpenSky OAuth2 client credentials (LIVE/HYBRID). Both empty = anonymous
      # access with a small daily credit budget. Set them in .env, never here.
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      OPENSKY_STATES_POLL_SECONDS: ${OPENSKY_STATES_POLL_SECONDS:-300}
      AEROSYNC_MONITORING_ENABLED: ${AEROSYNC_MONITORING_ENABLED:-true}
      AEROSYNC_LOG_LEVEL: ${AEROSYNC_LOG_LEVEL:-INFO}
      # Development-only demo accounts (off unless enabled in .env; no default password).
      AEROSYNC_DEMO_USERS_ENABLED: ${AEROSYNC_DEMO_USERS_ENABLED:-false}
      AEROSYNC_DEMO_PASSWORD: ${AEROSYNC_DEMO_PASSWORD:-}
      AEROSYNC_DEMO_USERS: "${AEROSYNC_DEMO_USERS:-bom.ops=BOM:OPERATIONS_CONTROLLER;del.ops=DEL:OPERATIONS_CONTROLLER;network.ops=BOM,DEL,BLR,HYD:OPERATIONS_CONTROLLER;bom.viewer=BOM:OPERATIONS_VIEWER}"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    restart: unless-stopped
    build:
      context: ./aerosync-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      BACKEND_UPSTREAM: http://backend:8080
    depends_on:
      backend:
        condition: service_started

  dashboard:
    restart: unless-stopped
    build:
      context: .
      dockerfile: aerosync-dashboard/Dockerfile
    ports:
      - "8502:8501"
    environment:
      BACKEND_URL: http://backend:8080
      ML_URL: http://ml-service:8000
    volumes:
      - ./aerosync-ml/data:/app/aerosync-ml/data:ro
      - ./aerosync-ml/gnn:/app/aerosync-ml/gnn:ro
    depends_on:
      backend:
        condition: service_started
      ml-service:
        condition: service_healthy

volumes:
  postgres_data:
