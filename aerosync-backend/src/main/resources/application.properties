# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
spring.application.name=aerosync-backend

# ── PostgreSQL ────────────────────────────────────────────────────────────────
# Credentials are externalized via environment variables.
# Defaults are for local development only.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aerosync}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jackson.property-naming-strategy=SNAKE_CASE

# ── JPA ──────────────────────────────────────────────────────────────────────
# ddl-auto=update still manages the original tables (flights, crew,
# disruptions). The operational network tables are owned by Flyway (below);
# Hibernate finds them already in place and leaves them unchanged.
spring.jpa.hibernate.ddl-auto=update
# SQL logging is off by default (Stage 4: ingestion and monitoring run every
# few minutes and would flood the log). Set JPA_SHOW_SQL=true to debug.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# ── Flyway (operational network schema) ──────────────────────────────────────
# Versioned migrations in src/main/resources/db/migration. An existing
# database without Flyway history is baselined at version 0 and then migrated
# forward (V1 schema, V2 reference airports, V3 user accounts, V4 live data
# and monitoring); nothing is dropped or recreated.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── Operational network ──────────────────────────────────────────────────────
# Time zone that defines "today" when no date is passed to /api/graph/network.
aerosync.operations.timezone=${AEROSYNC_OPERATIONS_TIMEZONE:Asia/Kolkata}
# SYNTHETIC demo network, seeded once on startup if the operational tables are
# empty (never overwrites existing data). Start date blank = today.
aerosync.synthetic-network.enabled=${AEROSYNC_SYNTHETIC_NETWORK_ENABLED:true}
aerosync.synthetic-network.days=${AEROSYNC_SYNTHETIC_NETWORK_DAYS:7}
aerosync.synthetic-network.start-date=${AEROSYNC_SYNTHETIC_NETWORK_START_DATE:}
aerosync.synthetic-network.random-seed=${AEROSYNC_SYNTHETIC_NETWORK_SEED:20261109}

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.time-zone=Asia/Kolkata

# ── External services ────────────────────────────────────────────────────────
# Docker Compose overrides this with http://ml-service:8000.
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
# Seconds one prediction may take before the fallback result is used.
ml.service.timeout-seconds=${ML_SERVICE_TIMEOUT_SECONDS:10}

# ── Google Gemini API ────────────────────────────────────────────────────────
# Set GEMINI_API_KEY in the environment. No hardcoded API key.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ── Logging ──────────────────────────────────────────────────────────────────
# Ingestion, weather and monitoring write one key=value line per event
# (event=ingestion_run source=OPENSKY status=SUCCESS ...). For JSON lines set
# the environment variable LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (Spring Boot).
logging.level.com.aerosync=${AEROSYNC_LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO

# ── Authentication (Stage 3) ────────────────────────────────────────────────
# JWT_SECRET: HS256 signing secret, at least 32 characters, from .env. There is
# deliberately no default: when it is empty the backend signs with a random
# per-process key (sessions end on restart) and logs a warning.
jwt.secret=${JWT_SECRET:}
# Token lifetime in milliseconds (default 8 hours).
jwt.expiration=${JWT_EXPIRATION:28800000}
# BCrypt work factor for password hashes.
aerosync.security.bcrypt-strength=${AEROSYNC_BCRYPT_STRENGTH:12}
# Failed logins per username and client address before a temporary lockout.
aerosync.security.login.max-failures=${AEROSYNC_LOGIN_MAX_FAILURES:5}
aerosync.security.login.lockout-minutes=${AEROSYNC_LOGIN_LOCKOUT_MINUTES:15}

# DEVELOPMENT ONLY demo accounts (DemoUserSeeder). Off unless
# AEROSYNC_DEMO_USERS_ENABLED=true; all accounts get AEROSYNC_DEMO_PASSWORD
# (no default: nothing is created while it is empty). Existing accounts are
# never modified. Format: username=IATA[,IATA...]:ROLE;...
aerosync.demo-users.enabled=${AEROSYNC_DEMO_USERS_ENABLED:false}
aerosync.demo-users.password=${AEROSYNC_DEMO_PASSWORD:}
aerosync.demo-users.accounts=${AEROSYNC_DEMO_USERS:bom.ops=BOM:OPERATIONS_CONTROLLER;del.ops=DEL:OPERATIONS_CONTROLLER;network.ops=BOM,DEL,BLR,HYD:OPERATIONS_CONTROLLER;bom.viewer=BOM:OPERATIONS_VIEWER}

# ── Weather API (OpenWeatherMap) ─────────────────────────────────────────────
# Set WEATHER_API_KEY in the environment. No hardcoded API key.
weather.api.key=${WEATHER_API_KEY:}
weather.api.url=https://api.openweathermap.org/data/2.5

# Stage 4: weather is looked up by airport coordinates for every airport of the
# network and stored with its observation time (table weather_reports).
aerosync.weather.timeout-seconds=${AEROSYNC_WEATHER_TIMEOUT_SECONDS:5}
# An observation is reused for this long before it is fetched again.
aerosync.weather.refresh-minutes=${AEROSYNC_WEATHER_REFRESH_MINUTES:30}
# An observation older than this is shown as stale and not used for
# predictions or disruption detection.
aerosync.weather.max-observation-age-minutes=${AEROSYNC_WEATHER_MAX_AGE_MINUTES:120}
# Forecasts are stored separately from observations and are display-only.
aerosync.weather.forecast.enabled=${AEROSYNC_WEATHER_FORECAST_ENABLED:true}
aerosync.weather.forecast.refresh-minutes=${AEROSYNC_WEATHER_FORECAST_REFRESH_MINUTES:180}
aerosync.weather.forecast.hours=${AEROSYNC_WEATHER_FORECAST_HOURS:12}

# ── Data source mode (Stage 4) ───────────────────────────────────────────────
# SYNTHETIC (default): generated demonstration data only; works with no
#                      external API. Nothing is fetched from OpenSky.
# LIVE:                external data only; nothing generated is seeded or served.
# HYBRID:              both, every record labelled with its source.
aerosync.data.mode=${AEROSYNC_DATA_MODE:SYNTHETIC}

# ── OpenSky Network (Stage 4, used in LIVE and HYBRID mode) ──────────────────
# OAuth2 client credentials of an OpenSky API client (account page on
# opensky-network.org). Both empty = anonymous access with a small daily
# credit budget. Never commit these; set them in .env.
aerosync.opensky.enabled=${AEROSYNC_OPENSKY_ENABLED:true}
aerosync.opensky.client-id=${OPENSKY_CLIENT_ID:}
aerosync.opensky.client-secret=${OPENSKY_CLIENT_SECRET:}
aerosync.opensky.base-url=${OPENSKY_BASE_URL:https://opensky-network.org/api}
aerosync.opensky.token-url=${OPENSKY_TOKEN_URL:https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token}
aerosync.opensky.connect-timeout-seconds=${OPENSKY_CONNECT_TIMEOUT_SECONDS:5}
aerosync.opensky.request-timeout-seconds=${OPENSKY_REQUEST_TIMEOUT_SECONDS:15}
# Attempts per request for timeouts and 5xx answers, with exponential backoff.
aerosync.opensky.max-attempts=${OPENSKY_MAX_ATTEMPTS:3}
aerosync.opensky.retry-backoff-ms=${OPENSKY_RETRY_BACKOFF_MS:1000}
aerosync.opensky.retry-max-backoff-ms=${OPENSKY_RETRY_MAX_BACKOFF_MS:15000}
# After a failed cycle the feed waits this long, doubling per further failure.
aerosync.opensky.failure-backoff-seconds=${OPENSKY_FAILURE_BACKOFF_SECONDS:60}
aerosync.opensky.failure-max-backoff-seconds=${OPENSKY_FAILURE_MAX_BACKOFF_SECONDS:1800}
# API credits per day to plan with. 0 = OpenSky's documented default
# (400 anonymous, 4000 for a standard account).
aerosync.opensky.daily-credits=${OPENSKY_DAILY_CREDITS:0}
# Extra callsign prefixes, e.g. "FDB=FZ,UAE=EK" (ICAO=IATA airline designators).
aerosync.opensky.airline-codes=${OPENSKY_AIRLINE_CODES:}

# Live aircraft states: wanted seconds between polls. The interval actually
# used is raised automatically when the credit budget cannot pay for it.
aerosync.opensky.states.poll-seconds=${OPENSKY_STATES_POLL_SECONDS:300}
# minLat,minLon,maxLat,maxLon. Blank = the box around the network's airports.
aerosync.opensky.states.bounding-box=${OPENSKY_BOUNDING_BOX:}
aerosync.opensky.states.bounding-box-margin-degrees=0.75
# A state whose last contact is older than this is not stored.
aerosync.opensky.states.max-age-seconds=${OPENSKY_STATES_MAX_AGE_SECONDS:300}
# An aircraft within this distance of an airport is listed for that airport.
aerosync.opensky.states.vicinity-km=${OPENSKY_VICINITY_KM:60}
aerosync.opensky.states.retention-hours=6

# Flight legs of previous days (OpenSky derives them in a nightly batch).
aerosync.opensky.flight-legs.enabled=${OPENSKY_FLIGHT_LEGS_ENABLED:true}
aerosync.opensky.flight-legs.check-minutes=${OPENSKY_FLIGHT_LEGS_CHECK_MINUTES:60}
aerosync.opensky.flight-legs.lookback-days=${OPENSKY_FLIGHT_LEGS_LOOKBACK_DAYS:2}
aerosync.opensky.flight-legs.max-calls-per-cycle=${OPENSKY_FLIGHT_LEGS_MAX_CALLS:20}

# ── Disruption monitoring (Stage 4) ──────────────────────────────────────────
# Detects potential disruptions and stores them as DETECTED. It never
# proposes, approves or executes anything.
aerosync.monitoring.enabled=${AEROSYNC_MONITORING_ENABLED:true}
aerosync.monitoring.interval-ms=${AEROSYNC_MONITORING_INTERVAL_MS:120000}
# Flights departing within this many minutes are watched.
aerosync.monitoring.lookahead-minutes=${AEROSYNC_MONITORING_LOOKAHEAD_MINUTES:180}
# Observed weather score (0-3) from which a weather disruption is raised.
aerosync.monitoring.weather-min-score=${AEROSYNC_MONITORING_WEATHER_MIN_SCORE:2}
# Delay-model probability from which a flight is flagged.
aerosync.monitoring.delay-risk-threshold=${AEROSYNC_MONITORING_DELAY_RISK_THRESHOLD:0.80}
aerosync.monitoring.crew-duty-alert-hours=${AEROSYNC_MONITORING_CREW_DUTY_ALERT_HOURS:11.0}
aerosync.monitoring.crew-duty-limit-hours=12.0
aerosync.monitoring.network.min-delay-minutes=15
aerosync.monitoring.network.lookback-hours=12
aerosync.monitoring.network.lookahead-hours=6
aerosync.monitoring.network.max-depth=4
aerosync.monitoring.max-new-per-cycle=25
aerosync.monitoring.reopen-cooldown-minutes=360
aerosync.monitoring.clear-after-minutes=10

# ── Background jobs (Stage 4) ────────────────────────────────────────────────
# Ingestion, weather refresh and monitoring run on these scheduler threads,
# never on request threads. On shutdown a running job may finish (up to 20 s).
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=aerosync-job-
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=20s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
