# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
spring.application.name=aerosync-backend

# ── PostgreSQL ────────────────────────────────────────────────────────────────
# Credentials are externalized via environment variables.
# Defaults are for local development only.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aerosync}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jackson.property-naming-strategy=SNAKE_CASE

# ── JPA ──────────────────────────────────────────────────────────────────────
# ddl-auto=update still manages the original tables (flights, crew,
# disruptions). The operational network tables are owned by Flyway (below);
# Hibernate finds them already in place and leaves them unchanged.
spring.jpa.hibernate.ddl-auto=update
# Set JPA_SHOW_SQL=false to silence SQL logging (the first start seeds ~10k rows).
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# ── Flyway (operational network schema) ──────────────────────────────────────
# Versioned migrations in src/main/resources/db/migration. An existing
# database without Flyway history is baselined at version 0 and then migrated
# forward (V1 schema, V2 reference airports); nothing is dropped or recreated.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── Operational network ──────────────────────────────────────────────────────
# Time zone that defines "today" when no date is passed to /api/graph/network.
aerosync.operations.timezone=${AEROSYNC_OPERATIONS_TIMEZONE:Asia/Kolkata}
# SYNTHETIC demo network, seeded once on startup if the operational tables are
# empty (never overwrites existing data). Start date blank = today.
aerosync.synthetic-network.enabled=${AEROSYNC_SYNTHETIC_NETWORK_ENABLED:true}
aerosync.synthetic-network.days=${AEROSYNC_SYNTHETIC_NETWORK_DAYS:7}
aerosync.synthetic-network.start-date=${AEROSYNC_SYNTHETIC_NETWORK_START_DATE:}
aerosync.synthetic-network.random-seed=${AEROSYNC_SYNTHETIC_NETWORK_SEED:20261109}

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.time-zone=Asia/Kolkata

# ── External services ────────────────────────────────────────────────────────
# Docker Compose overrides this with http://ml-service:8000.
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# ── Google Gemini API ────────────────────────────────────────────────────────
# Set GEMINI_API_KEY in the environment. No hardcoded API key.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.aerosync=DEBUG
logging.level.org.springframework.web=INFO

# ── JWT ──────────────────────────────────────────────────────────────────────
# Development-only fallback. Always override in production.
jwt.secret=${JWT_SECRET:THIS_IS_ONLY_FOR_LOCAL_DEVELOPMENT_123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Weather API (OpenWeatherMap) ─────────────────────────────────────────────
# Set WEATHER_API_KEY in the environment. No hardcoded API key.
weather.api.key=${WEATHER_API_KEY:}
weather.api.url=https://api.openweathermap.org/data/2.5
