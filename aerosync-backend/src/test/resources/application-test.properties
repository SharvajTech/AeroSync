# Test profile for the operational network integration tests: isolated
# in-memory H2 database (PostgreSQL mode) per Spring context, schema created
# from the JPA entities, no Flyway (the PostgreSQL migrations are exercised
# against PostgreSQL itself), no synthetic seeding on startup, no external
# calls.
spring.datasource.url=jdbc:h2:mem:aerosync-network-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=MONTH,YEAR,DAY,HOUR,MINUTE,SECOND,VALUE,KEY,USER;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=false

aerosync.synthetic-network.enabled=false
aerosync.operations.timezone=Asia/Kolkata

# Test-only values; blank keys disable Gemini/OpenWeatherMap calls and the ML
# service URL points at a closed port.
jwt.secret=test-only-jwt-signing-secret-0123456789-abcdefghij
gemini.api.key=
weather.api.key=
ml.service.url=http://127.0.0.1:9

# Stage 3: cheap BCrypt for tests; the default login limit (one test checks the lockout).
aerosync.security.bcrypt-strength=4
aerosync.security.login.max-failures=5
aerosync.demo-users.enabled=false
